[Input]
; Decimal Windows virtual-key code: F8 = 119. Restart game after editing.
MenuVirtualKey=119

[Performance]
; Bulk item/perk operations per main-thread tick, clamped to 1..64.
BatchPerTick=12

[Followers]
; Legacy key retained for old configurations; ignored by Freedom10.
; Authored alias packages from FreedomControlRuntime.esp are always used.
NativeFollowPackage=1
; 0: configurable stuck delay (default 12s). 1: quick recovery after 5s.
ForcedTether=0

[Interface]
; Freeze the simulation while the F8 menu is open.
PauseWorld=1
; Base system CJK font is now 24px; menu also exposes live scaling.
FontScalePercent=100

[Legion]
; Defaults for a new session; current-save settings are in the SKSE co-save.
AutoFight=1
HardControl=1
IsolateFactions=1
BattleRadius=5000

[Kernel]
; Set 0 only to diagnose a conflict. Requires a full game restart.
CrimeHooks=1
